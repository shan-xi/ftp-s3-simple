services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: transferdb
      POSTGRES_USER: transfer
      POSTGRES_PASSWORD: transfer
    ports: [ "5433:5432" ]
    volumes: [ "transfer-db:/var/lib/postgresql/data" ]
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U transfer -d transferdb" ]
      interval: 5s
      timeout: 3s
      retries: 20
  ftp:
    image: fauria/vsftpd
    environment:
      FTP_USER: testuser
      FTP_PASS: testpass123
      PASV_ADDRESS: 127.0.0.1
      PASV_MIN_PORT: 21100
      PASV_MAX_PORT: 21110
      LOCAL_UMASK: "022"
    ports: [ "2121:21", "21100-21110:21100-21110" ]
    volumes: [ "./ftp-data:/home/vsftpd" ]
    restart: unless-stopped
volumes:
  transfer-db:
